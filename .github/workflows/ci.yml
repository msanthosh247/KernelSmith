name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e .[dev]
      # no GPU on hosted runners: the CUDA tests skip themselves here...
      - run: pytest -q
      # ...and run here, under numba's CUDA simulator. The simulator has to be
      # switched on before numba.cuda is first imported, hence its own process.
      - name: CUDA backend (simulated)
        run: pytest tests/test_cuda.py tests/test_indicators.py tests/test_sort_by.py tests/test_tables.py tests/test_bootstrap.py -q
        env:
          NUMBA_ENABLE_CUDASIM: "1"
